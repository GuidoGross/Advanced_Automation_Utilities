repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-toml
      - id: check-yaml
      - id: check-illegal-windows-names
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=no]
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        language: golang
        additional_dependencies:
          - github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1
  - repo: local
    hooks:
      - id: synchronize_documentation
        name: Synchronize documentation
        entry: python scripts/synchronize_documentation.py
        language: system
        files: ^(advanced_automation_utilities/|README\.md$|wiki/|pyproject\.toml$|tests/conftest\.py$)
        pass_filenames: false
        stages: [pre-commit]
      - id: run_unit_tests
        name: Run unit tests
        entry: python scripts/run_tests.py --hypothesis-profile pre_commit --changed-files
        language: system
        files: ^(advanced_automation_utilities/|tests/|scripts/|pyproject\.toml$|\.github/workflows/unit_tests\.yml$|README\.md$|\.pre-commit-config\.yaml$)
        pass_filenames: true
        stages: [pre-commit]
      - id: delete-temporary-folders
        name: Delete temporary folders
        entry: python scripts/delete_temporary_folders.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]