[project]
name = "advanced_automation_utilities"
version = "1.3.13"
description = "A powerful, native Python library for Windows automation."
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "asynchrony",
    "automation",
    "bot",
    "keyboard",
    "library",
    "macro",
    "mouse",
    "physics-simulation",
    "rpa",
    "screen",
    "sound",
    "system",
    "timing",
    "utilities",
    "utility-library",
    "windows"
]
authors = [{name = "Guido Iván Gross", email = "grossguidoivan@gmail.com"}]
requires-python = ">= 3.15"
dependencies = [
    "mss >= 10.2.0",
    "numpy >= 2.2.0",
    "opencv-python >= 4.10.0",
    "psutil >= 6.0.0",
    "tui_utilities >= 1.9.17",
    "winrt-Windows.Foundation >= 3.2.0",
    "winrt-Windows.Foundation.Collections >= 3.2.0",
    "winrt-Windows.Graphics.Imaging >= 3.2.0",
    "winrt-Windows.Media.Ocr >= 3.2.0",
    "winrt-Windows.Storage.Streams >= 3.2.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Topic :: Desktop Environment"
]

[project.optional-dependencies]
dev = [
    "hypothesis >= 6.47.4",
    "pre-commit >= 3.2.0",
    "pytest >= 7.2.0",
    "pytest-cov >= 6.0.0"
]

[project.urls]
Homepage = "https://github.com/GuidoGross/Advanced_Automation_Utilities"
Repository = "https://github.com/GuidoGross/Advanced_Automation_Utilities"
Documentation = "https://github.com/GuidoGross/Advanced_Automation_Utilities/wiki"
"Bug Tracker" = "https://github.com/GuidoGross/Advanced_Automation_Utilities/issues"
Discussions = "https://github.com/GuidoGross/Advanced_Automation_Utilities/discussions"
Sponsor = "https://ko-fi.com/guidoivangross"

[build-system]
requires = ["setuptools >= 77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advanced_automation_utilities*"]

[tool.setuptools.package-data]
advanced_automation_utilities = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = "."