[project]
name = "advanced_automation_utilities"
version = "1.3.5"
description = "A powerful, native Python library for Windows automation."
readme = "README.md"
license = "AGPL-3.0-or-later"
keywords = [
    "automation",
    "utilities",
    "windows",
    "mouse",
    "keyboard",
    "screen",
    "timing",
    "sound",
    "system",
    "macro",
    "bot",
    "rpa"
]
authors = [{name = "Guido Iván Gross", email = "grossguidoivan@gmail.com"}]
requires-python = ">= 3.10"
dependencies = [
    "mss >= 6.1.0",
    "numpy >= 1.21.0",
    "opencv-python >= 4.5.5",
    "psutil >= 5.8.0",
    "PyGetWindow >= 0.0.9",
    "pyperclip >= 1.8.2",
    "tui_utilities >= 1.9.17",
    "winrt-Windows.Foundation >= 3.0",
    "winrt-Windows.Foundation.Collections >= 3.0",
    "winrt-Windows.Graphics.Imaging >= 3.0",
    "winrt-Windows.Media.Ocr >= 3.0",
    "winrt-Windows.Storage.Streams >= 3.0"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
    "Topic :: Desktop Environment"
]

[project.urls]
Homepage = "https://github.com/GuidoGross/Advanced_Automation_Utilities"
Repository = "https://github.com/GuidoGross/Advanced_Automation_Utilities"
"Bug Tracker" = "https://github.com/GuidoGross/Advanced_Automation_Utilities/issues"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["advanced_automation_utilities*"]
exclude = ["examples*"]