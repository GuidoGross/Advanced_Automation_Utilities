name: Verify documentation synchronization

on:
  push:
    paths:
      - "advanced_automation_utilities/**"
      - "wiki/**"
      - "scripts/synchronize_documentation.py"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/verify_documentation_synchronization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-documentation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release check context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $context_directory = Join-Path $env:RUNNER_TEMP "release-check-context"
          New-Item -ItemType Directory -Force -Path $context_directory | Out-Null
          if ($env:GITHUB_EVENT_NAME -eq "push" -and "${{github.event.before}}" -notmatch "^0+$") {
            $base_sha = "${{github.event.before}}"
            $changed_files = @(git diff --name-only "${{github.event.before}}" "$env:GITHUB_SHA")
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          } else {
            $base_sha = ""
            $changed_files = @("*")
          }
          [System.IO.File]::WriteAllText(
            (Join-Path $context_directory "base-sha.txt"),
            $base_sha,
            [System.Text.UTF8Encoding]::new($false)
          )
          [System.IO.File]::WriteAllLines(
            (Join-Path $context_directory "changed-files.txt"),
            $changed_files,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Upload release check context
        uses: actions/upload-artifact@v6
        with:
          name: release-check-context
          path: ${{runner.temp}}/release-check-context/
          if-no-files-found: error
          retention-days: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m pip install tui_utilities
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Verify documentation synchronization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/synchronize_documentation.py --check
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}