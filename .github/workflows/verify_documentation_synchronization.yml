name: Verify documentation synchronization

on:
  push:
    paths:
      - "advanced_automation_utilities/**"
      - "wiki/**"
      - "scripts/synchronize_documentation.py"
      - "pyproject.toml"
      - "README.md"
      - ".github/workflows/verify_documentation_synchronization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-documentation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m pip install tui_utilities
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Verify documentation synchronization
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/synchronize_documentation.py --check
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}