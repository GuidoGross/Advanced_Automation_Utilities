name: Publish

on:
  workflow_run:
    workflows: ["Unit tests", "Smoke test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{steps.checks.outputs.passed}}
      version: ${{steps.version.outputs.version}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}
          fetch-depth: 0
      - name: Download change context
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v5
        with:
          name: release-check-context
          run-id: ${{github.event.workflow_run.id}}
          github-token: ${{github.token}}
          path: ${{runner.temp}}/release-check-context
      - name: Prepare manual check context
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p "$RUNNER_TEMP/release-check-context"
          printf '*\n' > "$RUNNER_TEMP/release-check-context/changed-files.txt"
      - name: Verify smoke test and unit tests
        id: checks
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const targetSha = context.eventName === "workflow_run"
              ? context.payload.workflow_run.head_sha
              : context.sha;
            const changedFiles = fs.readFileSync(
              path.join(process.env.RUNNER_TEMP, "release-check-context", "changed-files.txt"),
              "utf8"
            ).replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean);
            const workflows = [
              {
                id: "smoke_test.yml",
                matches: file => file === "*" || file.startsWith("advanced_automation_utilities/")
                  || ["pyproject.toml", "README.md", ".github/workflows/smoke_test.yml"].includes(file)
              },
              {
                id: "unit_tests.yml",
                matches: file => file === "*" || file.startsWith("advanced_automation_utilities/")
                  || file.startsWith("tests/") || file.startsWith("scripts/")
                  || [
                    "pyproject.toml", ".pre-commit-config.yaml", "README.md",
                    ".github/workflows/unit_tests.yml"
                  ].includes(file)
              }
            ].filter(workflow => changedFiles.some(workflow.matches));
            if (workflows.length === 0) {
              core.info("Neither smoke test nor unit tests applies to these changes.");
              core.setOutput("passed", "true");
              return;
            }
            for (const workflowId of workflows) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId.id,
                head_sha: targetSha,
                branch: "main",
                per_page: 100
              });
              const matchingRuns = data.workflow_runs
                .filter(run => run.head_sha === targetSha && ["push", "workflow_dispatch"].includes(run.event))
                .sort((left, right) => right.run_number - left.run_number);
              if (matchingRuns.length === 0 || matchingRuns[0].status !== "completed") {
                core.info(`${workflowId.id} has not completed for ${targetSha};
                waiting for its completion event.`);
                core.setOutput("passed", "false");
                return;
              }
              if (matchingRuns[0].conclusion !== "success") {
                core.info(`${workflowId.id} concluded with ${matchingRuns[0].conclusion}.`);
                core.setOutput("passed", "false");
                return;
              }
            }
            core.setOutput("passed", "true");
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Read package version
        id: version
        if: steps.checks.outputs.passed == 'true'
        run: |
          python - <<'PY'
          import tomllib
          import os

          with open("pyproject.toml", "rb") as file: version = tomllib.load(file)["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding = "utf-8") as output:
              output.write(f"version={version}\n")
          PY
  publish:
    needs: verify
    if: needs.verify.outputs.passed == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{needs.verify.outputs.version}}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Check whether this version is already published
        id: version
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          import tomllib
          import os

          with open("pyproject.toml", "rb") as file: project = tomllib.load(file)["project"]
          package_name = project["name"].replace("-", "_")
          version = project["version"]
          url = f"https://pypi.org/pypi/{package_name}/{version}/json"
          try:
              with urlopen(url, timeout = 15): already_published = True
          except HTTPError as error:
              if error.code != 404: raise
              already_published = False
          print(f"Package version {version} already published: {already_published}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding = "utf-8") as output:
              output.write(f"changed={str(not already_published).lower()}\n")
          PY
      - name: Build distributions
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish distributions
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1