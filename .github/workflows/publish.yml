name: Publish

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Detect a package version change
        id: version
        env:
          BEFORE_SHA: ${{github.event.before}}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "$BEFORE_SHA:pyproject.toml" > "$RUNNER_TEMP/pyproject-before.toml"
          python - "$RUNNER_TEMP/pyproject-before.toml" pyproject.toml <<'PY'
          import os
          import sys
          import tomllib

          def read_version(path):
              with open(path, "rb") as file:
                  return tomllib.load(file)["project"]["version"]

          old_version = read_version(sys.argv[1])
          new_version = read_version(sys.argv[2])
          changed = old_version != new_version
          print(f"Package version: {old_version} -> {new_version}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={str(changed).lower()}\n")
          PY
      - name: Build distributions
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish distributions
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1