name: Publish

on:
  workflow_run:
    workflows: ["Unit tests", "Smoke test", "Verify documentation synchronization"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{steps.checks.outputs.passed}}
      version: ${{steps.version.outputs.version}}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}
          fetch-depth: 0
      - name: Download change context
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: release-check-context
          run-id: ${{github.event.workflow_run.id}}
          github-token: ${{github.token}}
          path: ${{runner.temp}}/release-check-context
      - name: Check whether the package version changed
        id: version
        env:
          BASE_SHA_FILE: ${{runner.temp}}/release-check-context/base-sha.txt
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import tomllib
          import subprocess

          base_sha = Path(os.environ["BASE_SHA_FILE"]).read_text(encoding = "utf-8").strip()
          if not re.fullmatch(r"[0-9a-f]{40,64}", base_sha):
              print("The triggering workflow was not started by a push with a base commit.")
              changed = False
              version = ""
          else:
              with open("pyproject.toml", "rb") as file:
                  current_version = tomllib.load(file)["project"]["version"]
              previous_project = subprocess.run(
                  ["git", "show", f"{base_sha}:pyproject.toml"],
                  capture_output = True,
                  check = True
              )
              previous_version = tomllib.loads(
                  previous_project.stdout.decode("utf-8")
              )["project"]["version"]
              changed = current_version != previous_version
              version = current_version if changed else ""
              print(f"Package version changed: {changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding = "utf-8") as output:
              output.write(f"changed={str(changed).lower()}\n")
              output.write(f"version={version}\n")
          PY
      - name: Verify all required checks
        id: checks
        if: steps.version.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const targetSha = context.payload.workflow_run.head_sha;
            const workflows = [
              "smoke_test.yml", "unit_tests.yml", "verify_documentation_synchronization.yml"
            ];
            for (const workflowId of workflows) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflowId,
                head_sha: targetSha,
                branch: "main",
                per_page: 100
              });
              const matchingRuns = data.workflow_runs.filter(run => run.head_sha === targetSha && run.event === "push").sort((left, right) => right.run_number - left.run_number);
              if (matchingRuns.length === 0 || matchingRuns[0].status !== "completed") {
                core.info(`${workflowId.id} has not completed for ${targetSha};
                waiting for its completion event.`);
                core.setOutput("passed", "false");
                return;
              }
              if (matchingRuns[0].conclusion !== "success") {
                core.info(`${workflowId.id} concluded with ${matchingRuns[0].conclusion}.`);
                core.setOutput("passed", "false");
                return;
              }
            }
            core.setOutput("passed", "true");
  publish:
    name: Publish to PyPI
    needs: verify
    if: needs.verify.outputs.passed == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/advanced-automation-utilities
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-${{needs.verify.outputs.version}}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Check whether this version is already published
        id: version
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from urllib.error import HTTPError
          import tomllib
          import os

          with open("pyproject.toml", "rb") as file: project = tomllib.load(file)["project"]
          package_name = project["name"].replace("-", "_")
          version = project["version"]
          url = f"https://pypi.org/pypi/{package_name}/{version}/json"
          try:
              with urlopen(url, timeout = 15): already_published = True
          except HTTPError as error:
              if error.code != 404: raise
              already_published = False
          print(f"Package version {version} already published: {already_published}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding = "utf-8") as output:
              output.write(f"changed={str(not already_published).lower()}\n")
          PY
      - name: Build distributions
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish distributions
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1