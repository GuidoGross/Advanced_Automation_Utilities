name: Unit tests

on:
  push:
    paths:
      - "advanced_automation_utilities/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "README.md"
      - ".github/workflows/unit_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release check context
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $context_directory = Join-Path $env:RUNNER_TEMP "release-check-context"
          New-Item -ItemType Directory -Force -Path $context_directory | Out-Null
          if ($env:GITHUB_EVENT_NAME -eq "push" -and "${{github.event.before}}" -notmatch "^0+$") {
            $changed_files = @(git diff --name-only "${{github.event.before}}" "$env:GITHUB_SHA")
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          } else {$changed_files = @("*")}
          [System.IO.File]::WriteAllLines(
            (Join-Path $context_directory "changed-files.txt"),
            $changed_files,
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Upload release check context
        uses: actions/upload-artifact@v6
        with:
          name: release-check-context
          path: ${{runner.temp}}/release-check-context/changed-files.txt
          if-no-files-found: error
          retention-days: 1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install project and development dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Run unit tests with 1.000 Hypothesis examples
        shell: pwsh
        env:
          BEFORE_SHA: ${{github.event.before}}
        run: |
          $ErrorActionPreference = "Stop"
          $changed_files = @()
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:BEFORE_SHA -notmatch "^0+$") {
            $changed_files = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          python scripts/run_tests.py --hypothesis-profile post_commit --require-full-suite-on-unpublished --changed-files $changed_files
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}