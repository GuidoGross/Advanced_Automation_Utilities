name: Unit tests

on:
  push:
    paths:
      - "advanced_automation_utilities/**"
      - "tests/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "README.md"
      - ".github/workflows/unit_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15-dev"
          allow-prereleases: true
      - name: Install project and development dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          $is_prerelease = python -c "import sys; print(sys.version_info.releaselevel != 'final')"
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          if ($is_prerelease -eq "True") {python -m pip install --ignore-requires-python -e ".[dev]"}
          else {python -m pip install -e ".[dev]"}
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Run unit tests with 1.000 Hypothesis examples
        shell: pwsh
        env:
          BEFORE_SHA: ${{github.event.before}}
        run: |
          $ErrorActionPreference = "Stop"
          $changed_files = @()
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:BEFORE_SHA -notmatch "^0+$") {
            $changed_files = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          & .\tests\run_tests.ps1 -HypothesisProfile post_commit -ChangedFiles $changed_files
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}