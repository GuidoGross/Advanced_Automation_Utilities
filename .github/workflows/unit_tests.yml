name: Unit tests

on:
  push:
    paths:
      - "advanced_automation_utilities/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - "README.md"
      - ".github/workflows/unit_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install project and development dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
      - name: Run unit tests with 1.000 Hypothesis examples
        shell: pwsh
        env:
          BEFORE_SHA: ${{github.event.before}}
        run: |
          $ErrorActionPreference = "Stop"
          $changed_files = @()
          if ($env:GITHUB_EVENT_NAME -eq "push" -and $env:BEFORE_SHA -notmatch "^0+$") {
            $changed_files = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA)
            if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}
          }
          python scripts/run_tests.py --hypothesis-profile post_commit --require-full-suite-on-unpublished --changed-files $changed_files
          if ($LASTEXITCODE -ne 0) {exit $LASTEXITCODE}