name: Tag Release

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  verify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      published: ${{steps.publication.outputs.published}}
      version: ${{steps.version.outputs.version}}
    steps:
      - name: Confirm the Publish job succeeded
        id: publication
        uses: actions/github-script@v8
        with:
          script: |
            const {data} = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100
            });
            const publishJob = data.jobs.find(job => job.name === "publish");
            const published = publishJob?.conclusion === "success";
            if (!published) {
              core.info(`Publish job conclusion: ${publishJob?.conclusion ?? "not found"}.`);
            }
            core.setOutput("published", String(published));
      - name: Check out repository
        if: steps.publication.outputs.published == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}
          fetch-depth: 0
      - name: Set up Python
        if: steps.publication.outputs.published == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Read package version
        if: steps.publication.outputs.published == 'true'
        id: version
        run: |
          python - <<'PY'
          import tomllib
          import os

          with open("pyproject.toml", "rb") as file: version = tomllib.load(file)["project"]["version"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding = "utf-8") as output:
              output.write(f"version={version}\n")
          PY
  tag:
    needs: verify
    if: needs.verify.outputs.published == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: tag-release-${{needs.verify.outputs.version}}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{github.event.workflow_run.head_sha || github.sha}}
          fetch-depth: 0
      - name: Create Git Tag
        env:
          PACKAGE_VERSION: ${{needs.verify.outputs.version}}
          TARGET_SHA: ${{github.event.workflow_run.head_sha || github.sha}}
        run: |
          git fetch --tags origin
          tag_name="v$PACKAGE_VERSION"
          if git tag --list "$tag_name" | grep -Fxq "$tag_name"; then
            echo "Tag $tag_name already exists."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag_name" "$TARGET_SHA" -m "Release $tag_name"
          for attempt in 1 2 3; do
            if push_output=$(git push origin "$tag_name" 2>&1); then
              printf '%s\n' "$push_output"
              exit 0
            else
              push_status=$?
            fi
            printf '%s\n' "$push_output"
            if [[ "$push_output" != *"fatal error in commit_refs_rules"* ]]; then
              exit "$push_status"
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "GitHub rejected the tag push with a ref-rules error after 3 attempts." >&2
              exit "$push_status"
            fi
            git fetch --tags origin
            if git tag --list "$tag_name" | grep -Fxq "$tag_name"; then
              echo "Tag $tag_name was created despite the push error."
              exit 0
            fi
            echo "GitHub returned a transient ref-rules error; retrying tag push."
            sleep "$((attempt * 5))"
          done